[tool.ruff]
# 目标 Python 版本
target-version = "py38"
# 要检查/格式化的目录（可按需调整）
include = ["*.py", "*.pyi"]
exclude = [
    ".git",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    ".venv",
    "venv",
    "notes",
]

# ===== Lint 规则 =====
[tool.ruff.lint]
# 启用的规则集：
# E/W  = pycodestyle 错误/警告
# F    = pyflakes（未使用变量、import 等）
# I    = isort（import 排序）
# UP   = pyupgrade（语法现代化）
# B    = flake8-bugbear（常见 bug 模式）
# SIM  = flake8-simplify（代码简化）
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
# 可以选择性忽略一些过于严格的规则
ignore = [
    "E501",   # 行长度由 formatter 控制，不报 lint
    "E701",   # 允许单行 if/def 后接分号（教学代码常见）
    "B008",   # 函数默认值里调用函数（如 FastAPI 依赖）
]

[tool.ruff.lint.per-file-ignores]
# 测试文件可以放宽一些
"test_*.py" = ["E402"]  # 允许测试文件中 import 不在顶部

[tool.ruff.lint.isort]
# import 分组之间加空行，组内按字母序
known-first-party = []
combine-as-imports = true

# ===== Formatter（格式化，替代 black） =====
[tool.ruff.format]
# 行宽：black 默认 88，可按需放宽到 100/120
line-width = 100
# 字符串引号：prefer double（优先双引号）
quote-style = "double"
# 缩进：4 空格（Python 标准）
indent-style = "space"
# 行尾换行符
line-ending = "lf"
# 是否对魔法注释（如 # fmt: off）保持尊重
docstring-code-format = true
